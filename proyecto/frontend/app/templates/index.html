{% extends "base.html" %}

{% block content %}
<div class="px-4 py-5 my-5 text-center">
    <h1 class="display-5 fw-bold">Bienvenido a LlamaChat</h1>
    <div class="col-lg-6 mx-auto">
      <p class="lead mb-4">Proyecto de Sistemas Distribuidos 2026. Plataforma de chat distribuida basada en microservicios.</p>
      
      <div class="d-grid gap-2 d-sm-flex justify-content-sm-center">
        {% if current_user.is_authenticated %}
            <a href="{{ url_for('profile') }}" class="btn btn-success btn-lg px-4 gap-3">Ir a mi Perfil</a>
        {% else %}
            <a href="{{ url_for('login') }}" class="btn btn-outline-secondary btn-lg px-4">Iniciar Sesión</a>
            <a href="{{ url_for('signup') }}" class="btn btn-primary btn-lg px-4 gap-3">Crear Cuenta</a>
        {% endif %}
      </div>
    </div>
</div>
{% endblock %}
